services:
  # Backend API (Express + SQLite, Node 22 for better-sqlite3)
  - type: web
    name: codesense-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # OpenRouter free tier — paste your key when applying the blueprint.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: CLIENT_ORIGIN
        value: "*"
      - key: USE_MOCK
        value: false
      - key: USE_FALLBACK_ON_ERROR
        value: true
      - key: OPENAI_MAX_RETRIES
        value: 3
      - key: OPENAI_RETRY_BASE_MS
        value: 3000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10
      # Optional: fill in to enable "Continue with Google".
      - key: GOOGLE_CLIENT_ID
        sync: false

  # Frontend SPA (Vite)
  - type: static
    name: codesense-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      # Automatically points at the deployed backend service.
      - key: VITE_API_URL
        fromService:
          type: web
          name: codesense-backend
          property: url
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html